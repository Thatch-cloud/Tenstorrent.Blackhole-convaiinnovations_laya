name: Model recipe and fixture integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 safetensors==0.8.0 '.[test]'
          python -m pip check
      - name: Test model helpers and committed reference integrity
        run: python -m pytest -q
      - name: Build and validate isolated wheel installation
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/laya-wheel"
          "$RUNNER_TEMP/laya-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/laya-wheel/bin/python" -I scripts/check_installed_recipe.py
