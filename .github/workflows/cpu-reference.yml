name: Independent CPU reference check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU reference dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 safetensors==0.8.0 transformers==5.17.0 tokenizers==0.23.2 huggingface-hub==1.16.1 '.'
          python -m pip check
          mkdir -p artifacts/host-reference
          python -m pip freeze > artifacts/host-reference/environment.lock
      - name: Fetch immutable upstream source
        run: |
          git init .cache/upstream/laya
          git -C .cache/upstream/laya remote add origin https://github.com/NandhaKishorM/laya.git
          git -C .cache/upstream/laya fetch --depth 1 origin 970dc8c5f63d7b886a68409493f37d569424f933
          git -C .cache/upstream/laya checkout --detach FETCH_HEAD
      - name: Download pinned public checkpoint
        run: python scripts/download_checkpoint.py
      - name: Capture and compare full CPU reference once
        run: python scripts/verify_reference_host.py --output artifacts/host-reference/capture
      - name: Retain CPU observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-cpu-reference
          path: artifacts/host-reference/
          if-no-files-found: error
          retention-days: 30
