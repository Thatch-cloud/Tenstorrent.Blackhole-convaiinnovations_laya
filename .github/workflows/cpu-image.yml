name: CPU reference image acceptance

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested CPU image and verify its registry digest
        type: boolean
        default: false
  pull_request:
    paths:
      - 'docker/cpu-reference.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cpu-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  cpu-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact source into reference image
        run: |
          mkdir -p artifacts/cpu-image
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --iidfile artifacts/cpu-image/image-id.txt \
            -f docker/cpu-reference.Dockerfile -t laya-cpu-reference:test .
          docker image inspect laya-cpu-reference:test > artifacts/cpu-image/image-inspect.json
      - name: Test real model without network or writable image filesystem
        run: |
          set -o pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e LAYA_CPU_INTEGRATION=1 -e LAYA_CPU_EXPECT_UID=10001 --entrypoint python laya-cpu-reference:test \
            -m unittest discover -s tests -p test_cpu_runtime.py -v \
            2>&1 | tee artifacts/cpu-image/test.log
      - name: Test platform UID and explicit pod listener
        run: |
          set -o pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e LAYA_CPU_INTEGRATION=1 -e LAYA_CPU_EXPECT_UID=1000 -e LAYA_CPU_TEST_LISTEN_HOST=0.0.0.0 \
            --entrypoint python laya-cpu-reference:test \
            -m unittest discover -s tests -p test_cpu_runtime.py -v \
            2>&1 | tee artifacts/cpu-image/platform-uid-test.log
      - name: Record installed dependencies
        if: always()
        run: |
          docker run --rm --network none --read-only --entrypoint cat \
            laya-cpu-reference:test /opt/laya/environment.lock > artifacts/cpu-image/environment.lock
          docker run --rm --network none --read-only --entrypoint cat \
            laya-cpu-reference:test /opt/laya/os-packages.lock > artifacts/cpu-image/os-packages.lock
      - name: Publish and verify the tested image
        if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REPOSITORY: ghcr.io/thatch-cloud/laya-cpu-reference
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          publish_tag="$PUBLISH_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag laya-cpu-reference:test "$publish_tag"
          docker push "$publish_tag"
          docker image inspect "$publish_tag" > artifacts/cpu-image/published-inspect.json
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('artifacts/cpu-image')
          image = json.loads((root / 'published-inspect.json').read_text())[0]
          tested = (root / 'image-id.txt').read_text().strip()
          assert image['Id'] == tested
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA']
          repo = os.environ['PUBLISH_REPOSITORY']
          refs = [ref for ref in image['RepoDigests'] if ref.startswith(repo + '@')]
          assert len(refs) == 1 and re.fullmatch(re.escape(repo) + r'@sha256:[0-9a-f]{64}', refs[0])
          (root / 'pull-reference.txt').write_text(refs[0] + '\n')
          PY
          pull_reference="$(cat artifacts/cpu-image/pull-reference.txt)"
          docker manifest inspect "$pull_reference" > artifacts/cpu-image/registry-manifest.json
          docker pull "$pull_reference"
          docker image inspect "$pull_reference" > artifacts/cpu-image/pulled-inspect.json
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('artifacts/cpu-image')
          tested = (root / 'image-id.txt').read_text().strip()
          manifest = json.loads((root / 'registry-manifest.json').read_text())
          pulled = json.loads((root / 'pulled-inspect.json').read_text())[0]
          assert manifest['config']['digest'] == tested == pulled['Id']
          assert pulled['Config']['User'] == '10001:10001'
          assert pulled['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA']
          report = dict(schema_version=1, source_commit=os.environ['GITHUB_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              image_config_digest=tested, pull_reference=(root / 'pull-reference.txt').read_text().strip(),
              cpu_container_acceptance=True, registry_roundtrip=True,
              tested_launch_profiles=[dict(uid=10001, listen_host='127.0.0.1'),
                                      dict(uid=1000, listen_host='0.0.0.0')],
              physical_acceptance=False, deployed_acceptance=False)
          (root / 'release.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Retain image acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-image-acceptance
          path: artifacts/cpu-image/
          retention-days: 7
