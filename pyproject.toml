[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-tt"
version = "0.1.0"
description = "Reference and runtime foundations for Laya on one Tenstorrent Blackhole card"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
reference = ["torch>=2.7", "transformers>=4.48", "safetensors>=0.4", "huggingface_hub>=0.20", "numpy>=1.26"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
laya_tt = ["schemas/*.schema.json"]
